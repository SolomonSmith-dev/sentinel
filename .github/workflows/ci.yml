name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: require api/package.json
        run: test -f api/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: test
        working-directory: api
        run: npm ci && npm run typecheck && npm test

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: require dashboard/package.json
        run: test -f dashboard/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build
        working-directory: dashboard
        run: npm ci && npm run build

  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: require sensor/capture/CMakeLists.txt
        run: test -f sensor/capture/CMakeLists.txt
      - name: build and replay pcaps
        run: |
          sudo apt-get update && sudo apt-get install -y libpcap-dev cmake
          cmake -S sensor/capture -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  shipper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: require sensor/shipper/pyproject.toml
        run: test -f sensor/shipper/pyproject.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: test
        working-directory: sensor/shipper
        run: pip install -e '.[dev]' && pytest -q tests ../suricata/test_retention.py

  deploy-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: require deploy-sensor.sh
        run: test -f deploy-sensor.sh
      - name: shellcheck
        run: shellcheck deploy-sensor.sh

  ci-gate:
    name: ci-gate
    needs: [secrets, api, dashboard, capture, shipper, deploy-script]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results=$RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "* | *" skipped "*)
              echo "One or more jobs failed, were cancelled, or were skipped"
              exit 1
              ;;
          esac
