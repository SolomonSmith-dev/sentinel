version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/api"
      - "/dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "pip"
    directory: "/sensor/shipper"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # numpy 2.4 wheels need x86-64-v2 (SSE4.2); the sensor's Core 2 Duo lacks it.
      # Matches the deliberate numpy==2.3.x pin in pyproject.toml.
      - dependency-name: "numpy"
        versions: [">=2.4"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
