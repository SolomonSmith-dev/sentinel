# Production overlay: secrets stay outside the checkout and Docker environment.
# Run with both -f sensor/docker-compose.yml -f sensor/compose.credentials.yml.
services:
  sentinel-shipper:
    environment:
      SENTINEL_TOKEN_FILE: /run/secrets/sentinel_token
      SENTINEL_SALT_FILE: /run/secrets/sentinel_salt
    secrets:
      - sentinel_token
      - sentinel_salt

secrets:
  sentinel_token:
    file: ${HOME}/.config/sentinel/token
  sentinel_salt:
    file: ${HOME}/.config/sentinel/salt
